server:
  port: 8080
spring:
  application:
    name: vision-inspection-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
vision:
  service-url: ${VISION_SERVICE_URL:http://localhost:8001}
management:
  endpoints:
    web:
      exposure:
        include: health,info
